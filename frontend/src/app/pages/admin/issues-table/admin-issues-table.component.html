<mat-card>
  <h2>All Issues</h2>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="status">
        <mat-option [value]="''">All</mat-option>
        <mat-option value="OPEN">Open</mat-option>
        <mat-option value="IN_PROGRESS">In Progress</mat-option>
        <mat-option value="RESOLVED">Resolved</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-button (click)="load()">Apply</button>
  </div>

  <table mat-table [dataSource]="issues" class="mat-elevation-z2 full">

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let i">{{ i.title }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let i">{{ i.status }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let i">{{ i.categoryName }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let i">
        <button mat-button color="primary" (click)="open(i.id)">Open</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols;"></tr>

  </table>
</mat-card>
