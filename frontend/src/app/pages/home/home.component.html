<div class="home-wrapper">

  <section class="hero">
    <h1>Welcome to Micro-Community</h1>
    <p>Report local issues. Track progress. Build better communities.</p>

    <div class="buttons">
      <button mat-raised-button color="primary" routerLink="/submit">
        Report an Issue
      </button>
      <button mat-stroked-button color="primary" routerLink="/my-issues">
        My Issues
      </button>
    </div>
  </section>

  <section class="features">
    <mat-card class="feature">
      <h3>Fast Reporting</h3>
      <p>Submit issues with photos and descriptions.</p>
    </mat-card>

    <mat-card class="feature">
      <h3>Live Tracking</h3>
      <p>Track issue status in real-time.</p>
    </mat-card>

    <mat-card class="feature">
      <h3>Admin Dashboard</h3>
      <p>Authorities can manage and resolve issues.</p>
    </mat-card>
  </section>

</div>
