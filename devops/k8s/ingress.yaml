apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: community-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: community.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: community-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: community-backend
                port:
                  number: 8080
