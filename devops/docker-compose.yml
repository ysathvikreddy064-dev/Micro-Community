version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: \${DB_NAME}
      POSTGRES_USER: \${DB_USER}
      POSTGRES_PASSWORD: \${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \${DB_USER} -d \${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DB_HOST: postgres
      DB_PORT: \${DB_PORT}
      DB_NAME: \${DB_NAME}
      DB_USER: \${DB_USER}
      DB_PASSWORD: \${DB_PASSWORD}
      JWT_SECRET: \${JWT_SECRET}
      S3_BUCKET: \${S3_BUCKET}
      S3_REGION: \${S3_REGION}
      S3_ACCESS_KEY: \${S3_ACCESS_KEY}
      S3_SECRET_KEY: \${S3_SECRET_KEY}
      S3_ENDPOINT: \${S3_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
